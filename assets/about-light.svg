<svg xmlns="http://www.w3.org/2000/svg" width="960" height="428" viewBox="0 0 960 428" role="img" aria-label="About me. I'm Javier, a final-year Data Engineering &amp; Systems student at ETSIT-UPM in Madrid. Most of what I build sits where data meets infrastructure: pipelines that stream, store and serve data, and the platforms around them. I also care about security. I co-founded FORTIA Security, a cybersecurity consultancy for small businesses (web security audits, phishing simulations and staff training), and I write my own defensive tools. And sometimes I build just for fun: party games for my friends, a poker chip counter for nights without chips, and a whole Pokémon fangame. Right now: my bachelor's thesis, a cyber situational awareness platform that turns raw security telemetry into correlated, explainable incidents. Redpanda, Sigma rules, multi-stage detection, Neo4j attack graphs and MITRE ATT&amp;CK."><title>About me. I'm Javier, a final-year Data Engineering &amp; Systems student at ETSIT-UPM in Madrid. Most of what I build sits where data meets infrastructure: pipelines that stream, store and serve data, and the platforms around them. I also care about security. I co-founded FORTIA Security, a cybersecurity consultancy for small businesses (web security audits, phishing simulations and staff training), and I write my own defensive tools. And sometimes I build just for fun: party games for my friends, a poker chip counter for nights without chips, and a whole Pokémon fangame. Right now: my bachelor's thesis, a cyber situational awareness platform that turns raw security telemetry into correlated, explainable incidents. Redpanda, Sigma rules, multi-stage detection, Neo4j attack graphs and MITRE ATT&amp;CK.</title><style>@keyframes w0{from{transform:translateX(0)}to{transform:translateX(906px)}}.w0{animation:w0 0.59s steps(49) 0.50s both}@keyframes w1{from{transform:translateX(0)}to{transform:translateX(906px)}}.w1{animation:w1 0.64s steps(53) 1.13s both}@k